<style>
:root{--bg:#fff;--fg:#202223;--mut:#6D7175;--line:#E1E3E5;--soft:#F6F6F7;--nav:rgba(255,255,255,.85);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Thmanyah","IBM Plex Sans Arabic","Noto Sans SC",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);backdrop-filter:blur(10px);z-index:60}
a{color:inherit;text-decoration:none}
.w{max-width:1120px;margin:auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--nav);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .w{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.wm{font-family:Montserrat,Arial,sans-serif;font-weight:800;letter-spacing:-.04em;font-size:27px;line-height:1;display:inline-flex;align-items:baseline;direction:ltr;color:var(--fg)}
.wm em{font-style:normal;font-weight:500;color:var(--mut)}
.wm.a b{font-family:"IBM Plex Sans Arabic",sans-serif;font-weight:700;letter-spacing:0}
.wm.z b{font-family:"Noto Sans SC",sans-serif;font-weight:900;letter-spacing:0}
.wm.big{display:flex;justify-content:center;font-size:clamp(54px,10vw,100px);color:#fff;margin-bottom:22px}
.dk .wm em{color:#C9CCCF}
.wm.sm{font-size:20px}
.nl{display:flex;gap:22px;font-size:14px;color:var(--mut)}.nl a:hover{color:var(--fg)}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:0;background:none;font:inherit;font-size:12px;padding:3px 10px;border-radius:99px;cursor:pointer;color:var(--mut)}
.lang button.on{background:var(--fg);color:var(--bg)}
