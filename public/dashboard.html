<script>
const LOGIN="/"; /* صفحة الدخول في موقعك هي الصفحة الرئيسية */
const $=s=>document.querySelector(s);
const h=(t,c,...k)=>{const e=document.createElement(t);if(c)e.className=c;for(const x of k.flat())if(x!=null&&x!==false)e.append(x);return e};
const fmt=(d,o)=>{try{return new Date(d).toLocaleString("ar-IQ-u-nu-latn",o||{dateStyle:"medium",timeStyle:"short"})}catch(_){return String(d)}};
const ST=[["new","جديد","gr"],["contacted","تم التواصل","wn"],["scheduled","جلسة مجدولة","br"],["won","تم التعاقد","ok"],["lost","مغلق","er"]];
const stOf=b=>b.lead_status||"new",stName=k=>(ST.find(s=>s[0]===k)||ST[0])[1],stCls=k=>(ST.find(s=>s[0]===k)||ST[0])[2];
const Q={3:["مميّز","er"],2:["محتمل","wn"],1:["أولي","gr"]};
const qual=b=>b.ready_to_invest_code===1&&b.monthly_income_code>=3?3:b.ready_to_invest_code<=2?2:1;
const ago=d=>{const m=Math.round((Date.now()-new Date(d))/6e4);return m<60?"قبل "+Math.max(m,1)+" د":m<1440?"قبل "+Math.round(m/60)+" س":"قبل "+Math.round(m/1440)+" يوم"};
const src=b=>{if(b.utm&&b.utm.utm_source)return b.utm.utm_source;try{return b.referrer?new URL(b.referrer).hostname.replace(/^www\./,""):"مباشر"}catch(_){return"مباشر"}};
const ini=s=>((s||"?").trim()[0]||"?").toUpperCase();
const badge=(t,c)=>h("span","bd "+c,t);
let PO=false,ME={},ALL=[],RANGE=30,QS="",QF="",SF="",PAGE=1;
/* ===== طبقة "بلا رسائل خطأ": لا تُعرض أي رسالة فشل؛ الاتصال يُعاد تلقائياً والحفظ المحلي يحمي التغييرات ===== */
const BAD=/تعذّر|تعذر|خطأ|فشل|لم يُنشر|انتهت الجلسة|لا تملك صلاحية|غير مصرّح|الخادم لا يقبل|غير موجود على الخادم|ملف غير صالح/;
function toast(t){t=String(t==null?"":t);if(!t||BAD.test(t)){console.warn("muted:",t);return}const e=h("div","ts",t);document.body.append(e);setTimeout(()=>e.remove(),3500)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function api(url,o,tries){tries=tries||3;let last={ok:false,st:0,j:{},tries:0};
  for(let i=0;i<tries;i++){
    try{const r=await fetch(url,o);const j=await r.json().catch(()=>({}));
      if(r.status===401){location.href=LOGIN;return{ok:false,st:401,j,tries:i}}
      if(r.status<500&&r.status!==429)return{ok:r.ok,st:r.status,j,tries:i};
      last={ok:false,st:r.status,j,tries:i}}catch(_){last={ok:false,st:0,j:{},tries:i}}
    if(i<tries-1)await sleep(500*Math.pow(2,i))}
  return last}
function copyText(t,btn){const done=()=>{if(btn){const o=btn.dataset.o||btn.textContent;btn.dataset.o=o;btn.textContent="تم النسخ";setTimeout(()=>{btn.textContent=o},1800)}};
  const fb=()=>{try{const a=h("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0;top:0";document.body.append(a);a.select();document.execCommand("copy");a.remove()}catch(_){}done()};
  try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb()}catch(_){fb()}}
addEventListener("unhandledrejection",e=>{e.preventDefault();console.warn(e.reason)});
addEventListener("error",e=>console.warn(e.error||e.message));
function rescue(){const m=$("#m");m.textContent="";try{overview()}catch(e){console.error(e);m.append(h("p","mt","جارٍ التحميل…"))}}
const closeD=()=>$("#dr").classList.remove("on");
$("#dr").onclick=e=>{if(e.target.id==="dr")closeD()};
const side=on=>{$("#sd").classList.toggle("on",on);$("#mk").classList.toggle("on",on)};
$("#mb").onclick=()=>side(true);$("#mk").onclick=()=>side(false);
/* زر طيّ/فتح القائمة بجانب الشعار */
const MQ=matchMedia("(max-width:900px)"),RT=document.documentElement;
function sdUi(){const mini=RT.dataset.sd==="mini"&&!MQ.matches,b=$("#sdt"),t=MQ.matches?"إغلاق القائمة":mini?"فتح القائمة":"طيّ القائمة";b.setAttribute("aria-expanded",String(!mini));b.title=t;b.setAttribute("aria-label",t);document.querySelectorAll(".sd .nv").forEach(a=>{const n=[...a.childNodes].find(x=>x.nodeType===3&&x.textContent.trim());a.title=mini&&n?n.textContent.trim():""})}
$("#sdt").onclick=()=>{if(MQ.matches){side(false);return}if(RT.dataset.sd==="mini")delete RT.dataset.sd;else RT.dataset.sd="mini";try{localStorage.setItem("sd",RT.dataset.sd||"")}catch(_){}sdUi()};
MQ.addEventListener("change",sdUi);sdUi();
$("#n5").onclick=()=>{PO=!PO;if(PO&&!path().startsWith("pipeline"))location.hash="#/pipeline";else route(true)};

document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeD();side(false);document.querySelectorAll(".pop").forEach(x=>x.classList.remove("on"))}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#gs").focus()}});
/* المظهر */
const THEME=()=>{try{return localStorage.getItem("ent_theme")||"auto"}catch(_){return"auto"}};
function applyTheme(t){const r=document.documentElement;if(t==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",t);try{localStorage.setItem("ent_theme",t)}catch(_){}}
applyTheme(THEME());
$("#th").onclick=()=>{const d=document.documentElement.getAttribute("data-theme")==="dark"||(THEME()==="auto"&&matchMedia("(prefers-color-scheme:dark)").matches);applyTheme(d?"light":"dark")};
/* الحفظ */
const PK="ent_pend";
const pendGet=()=>{try{return JSON.parse(localStorage.getItem(PK)||"{}")||{}}catch(_){return{}}};
const pendSet=o=>{try{localStorage.setItem(PK,JSON.stringify(o))}catch(_){}};
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const pend=(id,patch)=>api("/api/me?update=1",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:+id,...patch})},3);
async function reloadAll(){const r=await api("/api/me?bookings=1",{credentials:"same-origin"},2);if(r.ok&&Array.isArray(r.j.bookings)){ALL=r.j.bookings;const P=pendGet();ALL.forEach(x=>{if(P[x.id])Object.assign(x,P[x.id])});route(true)}}
let PFL=false;
async function pendFlush(){if(PFL)return;PFL=true;try{const P=pendGet();let rej=false;
  for(const id of Object.keys(P)){const r=await pend(id,P[id]);if(!r.ok&&!(r.st>=400&&r.st<500))break;
    const c=pendGet();if(same(c[id],P[id])){delete c[id];pendSet(c)}if(!r.ok)rej=true}
  if(rej)await reloadAll()}catch(_){}PFL=false}
async function setLead(b,patch){
  if(!can("update")){route(true);return false}
  Object.assign(b,patch);const P=pendGet();P[b.id]={...(P[b.id]||{}),...patch};pendSet(P);const mine=P[b.id];
  const r=await pend(b.id,patch);const c=pendGet();
  if(r.ok){if(same(c[b.id],mine)){delete c[b.id];pendSet(c)}toast("تم الحفظ");route(true);return true}
  if(r.st>=400&&r.st<500){delete c[b.id];pendSet(c);reloadAll();return false}
  toast("تم الحفظ على جهازك وسيُرسَل تلقائياً");route(true);return true;
}
function openD(b){location.hash="#/leads/"+b.id}
/* حذف عميل (للمدير فقط). حذف فعلي من القاعدة، فلا يُحفظ محلياً ولا يُعاد إرساله تلقائياً مثل التحديثات */
const canDel=()=>ME.isAdmin===true;
const DEL_ICON='<svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
async function delLead(b,after,btn){
  if(!canDel())return false;
  if(!confirm("حذف العميل «"+b.name+"» نهائياً؟\nسيُحذف معه حساب الدخول المرتبط به (إن وُجد) ولا يمكن التراجع عن ذلك."))return false;
  if(btn)btn.disabled=true;
  const r=await api("/api/me",{method:"DELETE",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:+b.id})},3);
  /* 404 not_found = محذوف مسبقاً (مثلاً من جهاز آخر)، فنُزيله من القائمة أيضاً */
  if(!(r.ok||(r.st===404&&r.j&&r.j.error==="not_found"))){
    if(btn)btn.disabled=false;if(r.st===401)return false;
    toast(r.st===403?"الحذف متاح للمدير فقط":"لم يتم الحذف، تحقق من الاتصال وحاول مرة أخرى");return false}
  ALL=ALL.filter(x=>String(x.id)!==String(b.id));
  const P=pendGet();if(P[b.id]){delete P[b.id];pendSet(P)}
  CU=CU.filter(u=>!(u.role==="client"&&String(u.booking_id)===String(b.id)));
  if(Array.isArray(CT))CT.forEach(c=>{if(String(c.booking_id)===String(b.id))c.booking_id=null});
  toast("تم حذف العميل");if(after)after();else route(true);return true;
